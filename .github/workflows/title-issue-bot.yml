name: Title issue bot

on:
  pull_request_target:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to process; leave empty to reconcile open PRs
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: title-issue-bot-${{ github.event.pull_request.number || inputs.pr_number || 'reconcile' }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read trusted bot code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Link and close title-referenced issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { run } = require('./.github/scripts/title-issue-bot.cjs');
            await run({ github, context, core });
